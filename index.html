<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>会议室预约</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">扫码即可预约</p>
        <h1>会议室预约</h1>
      </div>
      <div class="room-badge">ROOM 01</div>
    </header>

    <section class="hero-card">
      <div class="hero-icon">⌂</div>
      <div>
        <h2>小会议室</h2>
        <p>未来 30 天的预约安排</p>
      </div>
    </section>

    <section class="schedule-section">
      <div class="section-heading">
        <h3>未来预约</h3>
        <span id="booking-count" class="count-label"></span>
      </div>
      <div id="booking-list" class="booking-list"></div>
    </section>

    <button id="open-booking" class="primary-button">预订会议室</button>
    <p class="hint">请选择需要使用的时间段</p>
  </main>

  <div id="booking-modal" class="modal hidden" aria-hidden="true">
    <div class="modal-backdrop" data-close="true"></div>
    <section class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-header">
        <div>
          <p class="eyebrow">新建预约</p>
          <h2 id="modal-title">预订会议室</h2>
        </div>
        <button id="close-booking" class="icon-button" aria-label="关闭">×</button>
      </div>
      <form id="booking-form">
        <label>日期<input id="date" type="date" required /></label>
        <div class="form-row">
          <label>开始时间<input id="start-time" type="time" step="900" required /></label>
          <label>结束时间<input id="end-time" type="time" step="900" required /></label>
        </div>
        <label>部门<input id="department" type="text" placeholder="例如：市场部" required /></label>
        <label>联系方式 <span class="optional">选填</span><input id="contact" type="text" placeholder="手机号或微信号" /></label>
        <p id="form-error" class="form-error" role="alert"></p>
        <button class="primary-button" type="submit">确认预订</button>
      </form>
    </section>
  </div>

  <div id="toast" class="toast" role="status"></div>
  <script src="app.js?v=20260810-2"></script>
</body>
</html>
