<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <link rel="preconnect" href="https://mibxqjimftelazbkfpjl.supabase.co" crossorigin />
  <link rel="dns-prefetch" href="//mibxqjimftelazbkfpjl.supabase.co" />
  <title>会议室预约</title>
  <link rel="stylesheet" href="styles.css?v=20260811-3" />
</head>
<body>
  <main class="app-shell">
    <header class="compact-header">
      <div>
        <p class="eyebrow">会议室</p>
        <h1>小会议室</h1>
      </div>
      <span id="booking-count" class="count-label"></span>
    </header>

    <section class="schedule-section">
      <div id="booking-list" class="booking-list"></div>
    </section>

    <div class="action-bar">
      <button id="open-booking" class="primary-button">预订会议室</button>
    </div>
  </main>

  <div id="booking-modal" class="modal hidden" aria-hidden="true">
    <div class="modal-backdrop" data-close="true"></div>
    <section class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-header">
        <div>
          <p class="eyebrow">新建预约</p>
          <h2 id="modal-title">预订会议室</h2>
        </div>
        <button id="close-booking" class="icon-button" aria-label="关闭">×</button>
      </div>
      <form id="booking-form">
        <label>日期<input id="date" type="date" required /></label>
        <div class="form-row">
          <label>开始时间<input id="start-time" type="time" step="900" required /></label>
          <label>结束时间<input id="end-time" type="time" step="900" required /></label>
        </div>
        <label>姓名<input id="name" type="text" placeholder="请输入预订人姓名" autocomplete="name" required /></label>
        <p id="form-error" class="form-error" role="alert"></p>
        <button class="primary-button" type="submit">确认预订</button>
      </form>
    </section>
  </div>

  <div id="toast" class="toast" role="status"></div>
  <script src="app.js?v=20260811-8"></script>
</body>
</html>
